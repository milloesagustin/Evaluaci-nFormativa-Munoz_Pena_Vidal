<!DOCTYPE html>
<html lang="es">


<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZONALIBROS - Iniciar sesión</title>
    <script src="main.js"></script>
</head>


<body>

    <header>
        <div class="logo">#HOME</div>
        <ul class="nav">
            <li><a href="#INICIAR SESIÓN">INICIAR SESIÓN</a></li>
        </ul>
    </header>


    <section class="hero">
        <h1>ZONALIBROS</h1>
        <p>inicia sesion bro, si esta mala te lo diré</p>
    </section>


    <section class="Inicio de sesión">
        <h2> INICIO DE SESIÓN</h2>

        <form id="loginForm" novalidate>
            <div>
                <label for="correoLogin">Correo Electrónico:</label>
                <input type="email" id="correoLogin" name="correoLogin">
            </div>

            <div>
                <label for="passwordLogin">Contraseña:</label>
                <input type="password" id="passwordLogin" name="passwordLogin">
            </div>

            <div id="errorLogin" class="error" style="color: red; display: none;"></div>

            <button type="submit" id="btnLogin">Iniciar Sesión</button>
        </form>

    </section>

    <footer>
        <p>&copy; 2026 ZONALIBROS. Todos los derechos reservados.</p>
    </footer>

</body>

</html>
