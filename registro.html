<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZONALIBROS - Registro de Usuario</title>
    <link rel="stylesheet" href="assets/style.css">
    <script src="main.js"></script>
</head>
<body>

    <header>
        <div class="logo">ZONA<span>LIBROS</span></div>
        <nav>
            <ul class="nav">
                <li><a href="home.html">HOME</a></li>
                <li><a href="registro.html">REGISTRO</a></li>
                <li><a href="login.html" class="btn">INICIAR SESIÓN</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero" id="registro-section">
            <h1 class="hero__title">Registro de Usuario</h1>
            <p>Crea tu cuenta institucional para explorar el catálogo de ZONALIBROS</p>
            
            <article class="form-container">
                <form id="registroForm" novalidate>
                    <!-- 1. Nombre Completo -->
                    <div class="form-group">
                        <label for="nombre">NOMBRE COMPLETO</label>
                        <input type="text" id="nombre" maxlength="100" placeholder="Ej: Ignacio Muñoz">
                        <span id="errorNombre" class="error-msg error"></span>
                    </div>

                    <!-- 2. Correo Institucional -->
                    <div class="form-group">
                        <label for="correo">CORREO INSTITUCIONAL (@duoc.cl)</label>
                        <input type="email" id="correo" maxlength="60" placeholder="Ej: usuario@duoc.cl">
                        <span id="errorCorreo" class="error-msg error"></span>
                    </div>

                    <!-- 3. Contraseña -->
                    <div class="form-group">
                        <label for="password">CONTRASEÑA</label>
                        <input type="password" id="password" placeholder="Mínimo 10 caracteres (2 mayúsculas, 1 minúscula, 1 número, 1 @#$%)">
                        <span id="errorPassword" class="error-msg error"></span>
                    </div>

                    <!-- 4. Confirmar Contraseña -->
                    <div class="form-group">
                        <label for="confirmPassword">CONFIRMAR CONTRASEÑA</label>
                        <input type="password" id="confirmPassword" placeholder="Repite tu contraseña">
                        <span id="errorConfirmPassword" class="error-msg error"></span>
                    </div>

                    <!-- 5. Teléfono (opcional) -->
                    <div class="form-group">
                        <label for="telefono">TELÉFONO (opcional)</label>
                        <input type="number" id="telefono" placeholder="Ej: 912345678">
                        <span id="errorTelefono" class="error-msg error"></span>
                    </div>

                    <!-- 6. Géneros Favoritos -->
                    <div class="form-group checkbox-group">
                        <p>GÉNEROS FAVORITOS (Selecciona al menos uno)</p>
                        <div class="checkbox-grid">
                            <label><input type="checkbox" name="genero" value="FICCION"> FICCIÓN</label>
                            <label><input type="checkbox" name="genero" value="NO FICCION"> NO FICCIÓN</label>
                            <label><input type="checkbox" name="genero" value="MISTERIO"> MISTERIO</label>
                            <label><input type="checkbox" name="genero" value="TERROR"> TERROR</label>
                            <label><input type="checkbox" name="genero" value="SUSPENSO"> SUSPENSO</label>
                            <label><input type="checkbox" name="genero" value="HISTORIA"> HISTORIA</label>
                        </div>
                        <span id="errorGenero" class="error-msg error"></span>
                    </div>

                    <button type="submit" class="btn" id="btn-registrar">REGISTRAR</button>

                    <div class="form-footer-links">
                        <p class="register-prompt">
                            ¿Ya tienes una cuenta? <a href="login.html" class="link-primary">Inicia sesión</a>
                        </p>
                    </div>
                </form>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ZONALIBROS. Todos los derechos reservados.</p>
    </footer>
    
</body>
</html>
